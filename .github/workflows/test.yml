name: Test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Required files exist
        run: |
          test -f index.html
          test -f frank-app.js
          test -f config.js
          test -f manifest.json
          node --check frank-app.js
      - name: No Puter references
        run: '! grep -rniI puter --exclude-dir=.git --exclude-dir=.github .'
