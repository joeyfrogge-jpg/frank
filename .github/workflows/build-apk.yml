name: Build FRANK APK
on:
  workflow_dispatch:
    inputs:
      api_base:
        description: "FRANK server URL the APK talks to (blank = repo variable FRANK_API_BASE, else UI-only)"
        required: false
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'frank-app.js'
      - 'config.js'
      - 'manifest.json'
      - 'sw.js'
      - 'terms.html'
      - 'privacy.html'
      - 'icons/**'
      - '.github/workflows/build-apk.yml'

env:
  # push-triggered builds use the repo variable FRANK_API_BASE (Settings -> Variables)
  API_BASE: ${{ github.event.inputs.api_base || vars.FRANK_API_BASE }}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
      - name: Prepare web bundle
        run: |
          mkdir -p www/icons
          cp index.html frank-app.js config.js manifest.json sw.js terms.html privacy.html www/
          cp icons/*.png www/icons/
          # an APK has no server of its own: if config.js has no API_BASE, use the one given here
          if [ -n "$API_BASE" ]; then sed -i "s#API_BASE: \"\"#API_BASE: \"${API_BASE%/}\"#" www/config.js; fi
          grep -n API_BASE www/config.js
          ! grep -ril puter www || { echo "::error::Puter reference found in bundle"; exit 1; }
      - name: Capacitor Android
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          npx cap init "FRANK" "com.frank.video" --web-dir www
          npx cap add android
          npx cap sync android
      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
      - name: Name the APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk frank.apk
      - name: Publish to Releases (stable download link)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FRANK Android app (latest)
          body: "Latest FRANK debug APK. Install: https://github.com/${{ github.repository }}/releases/download/apk-latest/frank.apk"
          files: frank.apk
          make_latest: false
