name: Build FRANK APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - index.html
      - frank-app.js
      - config.js
      - manifest.json
      - sw.js
      - terms.html
      - privacy.html
      - icons/**
      - .github/workflows/build-apk.yml

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepare web bundle
        run: |
          mkdir -p www/icons
          cp index.html frank-app.js config.js manifest.json www/
          [ -f sw.js ] && cp sw.js www/ || true
          [ -f terms.html ] && cp terms.html www/ || true
          [ -f privacy.html ] && cp privacy.html www/ || true
          [ -d icons ] && cp icons/*.png www/icons/ || true
          ls -la www/

      - name: Create Capacitor project files
        run: |
          printf '%s\n' '{
            "name": "frankgpt",
            "version": "2.0.0",
            "private": true,
            "dependencies": {
              "@capacitor/android": "6.1.2",
              "@capacitor/cli": "6.1.2",
              "@capacitor/core": "6.1.2"
            }
          }' > package.json
          printf '%s\n' '{
            "appId": "com.frankgpt.app",
            "appName": "FrankGPT",
            "webDir": "www",
            "android": { "allowMixedContent": true },
            "server": { "androidScheme": "https" }
          }' > capacitor.config.json
          cat package.json
          cat capacitor.config.json

      - name: Install Capacitor and add Android
        run: |
          npm install
          npx cap add android
          npx cap sync android
          test -f android/gradlew

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Collect APK
        run: |
          APK=$(find android/app/build/outputs/apk -name "*.apk" | head -n 1)
          echo "APK=$APK"
          cp "$APK" frank.apk
          ls -la frank.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: frank-apk
          path: frank.apk

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: FrankGPT Android (latest)
          body: Debug APK for FrankGPT. Free standalone mode works without a server.
          files: frank.apk
          make_latest: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
